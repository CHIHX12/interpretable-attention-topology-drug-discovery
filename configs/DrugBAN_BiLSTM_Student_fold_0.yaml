SOLVER:
  BATCH_SIZE: 128
  MAX_EPOCH: 50
  LR: 1e-4
  SEED: 42
  NUM_WORKERS: 4
  PRETRAINED_MODEL: "./result/DrugBAN_BiLSTM/best_model_epoch_94.pth"

DA:
  TASK: False
  USE: False

PROTEIN:
  USE_BILSTM: True
  LSTM_HIDDEN_DIM: 256
  LSTM_NUM_LAYERS: 2
  LSTM_DROPOUT: 0.2
  EMBEDDING_DIM: 128
  FEATURE_DIM: 4
  MAX_PROTEIN_LENGTH: 1200
  PADDING: True

DECODER:
  BINARY: 1

MULTITASK:
  ENABLED: True
  ALPHA: 0.5               # Classification weight
  BETA: 0.5                # Regression weight

# Knowledge Distillation settings
DISTILLATION:
  ENABLED: True
  EXPERT_LOW_MODEL: "result/LORO_Expert_Low/fold_0/best_model_epoch_50.pth"     # Will be set by run script
  EXPERT_HIGH_MODEL: "result/LORO_Expert_High/fold_0/best_model_epoch_44.pth"    # Will be set by run script
  TEMPERATURE: 3.0         # Softmax temperature for soft targets
  ALPHA_DISTILL: 0.5       # Weight for distillation loss vs ground truth

RESULT:
  OUTPUT_DIR: "./result/LORO_Student"
  SAVE_MODEL: True

COMET:
  PROJECT_NAME: "DrugBAN_Student"
  TAG: "Knowledge_Distillation"
