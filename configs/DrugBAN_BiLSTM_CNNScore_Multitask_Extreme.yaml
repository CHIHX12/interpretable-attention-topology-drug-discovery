SOLVER:
  BATCH_SIZE: 128
  MAX_EPOCH: 50
  LR: 1e-4
  SEED: 42
  NUM_WORKERS: 4
  PRETRAINED_MODEL: "./result/DrugBAN_BiLSTM/best_model_epoch_94.pth"

DA:
  TASK: False
  USE: False

PROTEIN:
  USE_BILSTM: True
  LSTM_HIDDEN_DIM: 256
  LSTM_NUM_LAYERS: 2
  LSTM_DROPOUT: 0.2
  EMBEDDING_DIM: 128
  FEATURE_DIM: 4
  MAX_PROTEIN_LENGTH: 1200
  PADDING: True

DECODER:
  BINARY: 1

MULTITASK:
  ENABLED: True
  ALPHA: 0.5
  BETA: 0.5

RESULT:
  OUTPUT_DIR: "./result/LORO_Extreme"
  SAVE_MODEL: True

COMET:
  PROJECT_NAME: "DrugBAN_BiLSTM_CNNScore_Multitask_Extreme"
  TAG: "LORO_Extreme_Classification"
