SOLVER:
  BATCH_SIZE: 64
  MAX_EPOCH: 50
  LR: 1e-4
  DA_LR: 5e-5
  SEED: 42
  NUM_WORKERS: 4
  PRETRAINED_MODEL: ""      # DA 從頭訓練，不用預訓練模型

DA:
  TASK: True                # 啟用 DA 數據格式 (source_train, target_train, target_test)
  USE: True                 # 啟用 DA 損失
  METHOD: "DANN"            # Domain-Adversarial Neural Network
  USE_ENTROPY: False
  RANDOM_LAYER: False
  ORIGINAL_RANDOM: False
  RANDOM_DIM: 256
  INIT_EPOCH: 5             # 前 5 個 epoch 先穩定模型，再加 DA 損失
  LAMB_DA: 1                # Gradient reversal lambda

PROTEIN:
  USE_BILSTM: True
  LSTM_HIDDEN_DIM: 256
  LSTM_NUM_LAYERS: 2
  LSTM_DROPOUT: 0.2
  EMBEDDING_DIM: 128
  FEATURE_DIM: 4
  MAX_PROTEIN_LENGTH: 1200
  PADDING: True

DECODER:
  BINARY: 2                 # DA 用 softmax 二分類

MULTITASK:
  ENABLED: True
  ALPHA: 0.5
  BETA: 0.5

RESULT:
  OUTPUT_DIR: "./result/LORO_DA_DANN"
  SAVE_MODEL: True

COMET:
  PROJECT_NAME: "DrugBAN_LORO_DA_DANN"
  TAG: "LORO_DANN"
