SOLVER:
  BATCH_SIZE: 128
  MAX_EPOCH: 50
  LR: 1e-4
  SEED: 42
  NUM_WORKERS: 4
  PRETRAINED_MODEL: "./result/DrugBAN_BiLSTM/best_model_epoch_94.pth"

DA:
  TASK: False
  USE: False

PROTEIN:
  USE_BILSTM: True
  LSTM_HIDDEN_DIM: 256
  LSTM_NUM_LAYERS: 2
  LSTM_DROPOUT: 0.2
  EMBEDDING_DIM: 128
  FEATURE_DIM: 4
  MAX_PROTEIN_LENGTH: 1200
  PADDING: True

DECODER:
  BINARY: 1

# Expert model: focus on regression (Z > 0.8 range)
# Classification is trivial (all Y=1), so weight regression more
MULTITASK:
  ENABLED: True
  ALPHA: 0.1               # Low weight for classification (trivial task)
  BETA: 0.9                # High weight for regression (main task)

RESULT:
  OUTPUT_DIR: "./result/LORO_Expert_High"
  SAVE_MODEL: True

COMET:
  PROJECT_NAME: "DrugBAN_Expert_High"
  TAG: "Expert_High_Regression"
