name: drugban-bilstm
channels:
  - pytorch
  - dglteam
  - conda-forge
  - defaults
dependencies:
  - python=3.8
  - pytorch>=1.7.1
  - torchvision
  - torchaudio
  - cudatoolkit=11.3     # adjust to your CUDA version
  - pip
  - pip:
    - dgl-cu113>=0.7.1   # match your CUDA version (cu102/cu111/cu113/cu116)
    - dgllife>=0.2.8
    - rdkit>=2021.03.2
    - selfies>=2.1.0
    - numpy>=1.20.2
    - scikit-learn>=0.24.2
    - pandas>=1.2.4
    - yacs>=0.1.8
    - prettytable>=2.2.1
    - tqdm>=4.62.0
    - matplotlib>=3.4.0
    - seaborn>=0.11.0
    - scipy>=1.7.0
